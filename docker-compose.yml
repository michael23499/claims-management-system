# Local MongoDB for development. Start it with: docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: claims-mongo
    restart: unless-stopped
    ports:
      - "27018:27017" # host:container — Mongo is reachable at localhost:27018
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
